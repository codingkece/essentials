<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Discover curated essential oil diffuser recipes. Filter by ingredients, and save your favorites."
    />
    <title>Diffuser Blends</title>
    <link rel="stylesheet" href="assets/style.css" />
    <link
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>"
      rel="icon"
    />
    <script src="assets/js/supabase.js"></script>
    <script src="assets/js/dexie.js"></script>
  </head>
  <body>
    <!-- Top Header -->
    <header class="app-header">
      <div class="header-nav-row">
        <!-- View Tabs & Sync Button -->
        <div class="header-container">
          <nav class="tab-nav" aria-label="Blend collections">
            <button id="tab-all" class="tab-btn active" type="button">
              All Blends
            </button>
            <button id="tab-saved" class="tab-btn" type="button">
              <svg
                class="tab-icon"
                viewBox="0 0 24 24"
                fill="currentColor"
                aria-hidden="true"
              >
                <path
                  d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
                />
              </svg>
              <span>Favorites</span>
              <span id="saved-counter" class="saved-badge">0</span>
            </button>
          </nav>

          <button
            id="auth-btn"
            class="action-header-btn"
            type="button"
            aria-label="Cloud Sync"
            title="Cloud Sync"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
              <path d="M21 3v5h-5"></path>
              <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
              <path d="M3 21v-5h5"></path>
            </svg>
          </button>
        </div>

        <!-- Search & Filter Controls -->
        <div class="toolbar">
          <div class="oil-combobox" id="oil-combobox">
            <div class="combobox-input-wrapper">
              <svg
                class="combobox-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z" />
              </svg>
              <input
                type="search"
                id="oil-search-input"
                class="combobox-input"
                placeholder="Search or select essential oils..."
                autocomplete="off"
                spellcheck="false"
                role="combobox"
                aria-expanded="false"
                aria-autocomplete="list"
                aria-controls="oil-options-list"
              />
              <button
                id="clear-oil-input-btn"
                class="clear-combobox-btn"
                type="button"
                aria-label="Clear search input"
                hidden
              >
                &times;
              </button>
              <button
                id="toggle-oil-dropdown-btn"
                class="combobox-chevron-btn"
                type="button"
                aria-label="Toggle oils menu"
                tabindex="-1"
              >
                <svg
                  class="chevron-icon"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                >
                  <path d="M7 10l5 5 5-5z" />
                </svg>
              </button>
            </div>

            <div
              id="oil-dropdown"
              class="combobox-dropdown"
              role="listbox"
              aria-label="Essential oils"
              hidden
            >
              <div id="oil-options-list" class="combobox-options-list"></div>
            </div>
          </div>

          <div class="toolbar-actions">
            <div class="sort-combobox" id="sort-combobox">
              <button
                id="sort-btn"
                class="sort-btn"
                type="button"
                aria-haspopup="listbox"
                aria-expanded="false"
                title="Sort blends by number of oils"
              >
                <svg
                  class="sort-icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <line x1="4" y1="6" x2="10" y2="6"></line>
                  <line x1="4" y1="12" x2="15" y2="12"></line>
                  <line x1="4" y1="18" x2="20" y2="18"></line>
                </svg>
                <span id="sort-btn-label" class="sort-btn-label"
                  >Sort by oils</span
                >
                <svg
                  class="sort-chevron-icon"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                >
                  <path d="M7 10l5 5 5-5z"></path>
                </svg>
              </button>

              <div
                id="sort-dropdown"
                class="sort-dropdown"
                role="listbox"
                aria-label="Sort options"
                hidden
              >
                <div
                  class="sort-option"
                  role="option"
                  data-sort="shortest"
                  tabindex="0"
                  aria-selected="false"
                >
                  <div class="sort-option-left">
                    <svg
                      class="sort-option-svg"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <line x1="4" y1="6" x2="10" y2="6"></line>
                      <line x1="4" y1="12" x2="15" y2="12"></line>
                      <line x1="4" y1="18" x2="20" y2="18"></line>
                    </svg>
                    <div class="sort-option-text">
                      <span class="sort-option-name">Shortest recipes</span>
                      <span class="sort-option-desc">Fewest oils first</span>
                    </div>
                  </div>
                  <span class="sort-badge-pill">Fewest</span>
                  <span class="sort-check" aria-hidden="true"></span>
                </div>

                <div
                  class="sort-option"
                  role="option"
                  data-sort="longest"
                  tabindex="0"
                  aria-selected="false"
                >
                  <div class="sort-option-left">
                    <svg
                      class="sort-option-svg"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <line x1="4" y1="6" x2="20" y2="6"></line>
                      <line x1="4" y1="12" x2="15" y2="12"></line>
                      <line x1="4" y1="18" x2="10" y2="18"></line>
                    </svg>
                    <div class="sort-option-text">
                      <span class="sort-option-name">Longest recipes</span>
                      <span class="sort-option-desc">Most oils first</span>
                    </div>
                  </div>
                  <span class="sort-badge-pill">Most</span>
                  <span class="sort-check" aria-hidden="true"></span>
                </div>

                <div
                  class="sort-option is-selected"
                  role="option"
                  data-sort="default"
                  tabindex="0"
                  aria-selected="true"
                >
                  <div class="sort-option-left">
                    <svg
                      class="sort-option-svg"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path
                        d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"
                      ></path>
                      <path d="M3 3v5h5"></path>
                    </svg>
                    <div class="sort-option-text">
                      <span class="sort-option-name">Default order</span>
                      <span class="sort-option-desc">Curated collection</span>
                    </div>
                  </div>
                  <span class="sort-check" aria-hidden="true"></span>
                </div>
              </div>
            </div>

            <button
              id="clear-filters-btn"
              class="clear-btn"
              type="button"
              hidden
            >
              Clear all
            </button>
          </div>
        </div>
      </div>

      <div
        id="active-filters"
        class="filter-container"
        aria-live="polite"
      ></div>

      <div class="status-bar">
        <span id="result-count" class="result-count">Loading recipes...</span>
      </div>
    </header>

    <!-- Main Grid -->
    <main>
      <div id="recipe-grid" class="grid" role="region" aria-live="polite"></div>
    </main>

    <!-- Floating Dock Pagination -->
    <footer id="pagination" class="pagination"></footer>

    <!-- Recipe Detail Modal -->
    <dialog id="recipe-modal" class="modal">
      <div class="modal-wrapper">
        <div class="modal-card">
          <button id="close-modal" class="close-btn" aria-label="Close dialog">
            &times;
          </button>

          <div class="modal-image-pane">
            <img id="modal-img" src="" alt="" loading="eager" />
          </div>

          <div class="modal-footer-bar">
            <h2 id="modal-title" class="modal-title">Blend Name</h2>

            <div class="modal-actions">
              <button
                id="modal-prev-btn"
                class="modal-icon-action-btn"
                type="button"
                aria-label="Previous recipe"
                title="Previous recipe"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
              </button>

              <button
                id="modal-next-btn"
                class="modal-icon-action-btn"
                type="button"
                aria-label="Next recipe"
                title="Next recipe"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
              </button>

              <button
                id="modal-share-btn"
                class="modal-icon-action-btn"
                type="button"
                aria-label="Share blend"
                title="Share blend"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <circle cx="18" cy="5" r="3"></circle>
                  <circle cx="6" cy="12" r="3"></circle>
                  <circle cx="18" cy="19" r="3"></circle>
                  <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                  <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                </svg>
              </button>

              <button
                id="modal-fav-btn"
                class="modal-icon-action-btn"
                type="button"
                aria-label="Save blend"
                title="Save blend"
              ></button>
            </div>
          </div>
        </div>
      </div>
    </dialog>

    <!-- Supabase Auth / Cloud Sync Modal -->
    <dialog id="auth-modal" class="modal">
      <div class="modal-wrapper">
        <div class="auth-card">
          <button
            id="close-auth-modal"
            class="close-btn"
            aria-label="Close dialog"
          >
            &times;
          </button>

          <h2 class="auth-heading">Cloud Sync</h2>
          <p class="auth-subheading">
            Sync your favorites securely with Supabase.
          </p>

          <form id="auth-form" class="auth-form">
            <div class="auth-field">
              <label for="auth-email">Email</label>
              <input
                type="email"
                id="auth-email"
                class="auth-input"
                required
                autocomplete="email"
                placeholder="user@example.com"
              />
            </div>
            <div class="auth-field">
              <label for="auth-password">Password</label>
              <input
                type="password"
                id="auth-password"
                class="auth-input"
                required
                autocomplete="current-password"
                placeholder="••••••••"
              />
            </div>
            <div id="auth-error" class="auth-msg error" hidden></div>
            <div id="auth-success" class="auth-msg success" hidden></div>
            <button type="submit" id="auth-submit-btn" class="auth-btn-primary">
              Sign In
            </button>
          </form>

          <div id="auth-user-panel" class="auth-user-panel" hidden>
            <div class="auth-user-info">
              <span class="auth-badge-active">● Connected</span>
              <p id="auth-user-email" class="auth-user-email"></p>
            </div>
            <div id="auth-sync-status" class="auth-status-text"></div>
            <div class="auth-panel-actions">
              <button
                type="button"
                id="auth-sync-now-btn"
                class="auth-btn-primary"
              >
                Sync Now
              </button>
              <button
                type="button"
                id="auth-signout-btn"
                class="auth-btn-secondary"
              >
                Sign Out
              </button>
            </div>
          </div>
        </div>
      </div>
    </dialog>

    <script type="module" src="assets/js/app.js"></script>
  </body>
</html>
